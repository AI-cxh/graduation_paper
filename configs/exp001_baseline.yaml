experiment:
  id: "EXP-001"
  name: "MMMC minimum baseline and conflict-behavior confirmation"
  seed: 20260724

dataset:
  repository: "ustc-zhangzm/MMMC"
  revision: "0bdbffbb35bf1a2569468fd939a5f70290442e55"
  # A pair contains one conflict row and its matched clean row for the same image.
  smoke_pair_count: 50
  baseline_pair_count: 500
  audit_pair_count: 200
  stratify_by:
    - "conflict_type"
  sample_manifest: "data/manifests/exp001_sample_ids.jsonl"
  sample_summary: "data/manifests/exp001_sample_summary.json"

model:
  repository: "Qwen/Qwen2.5-VL-3B-Instruct"
  revision: "66285546d2b821cf421d4f5eb2576359d3770cd3"
  dtype: "bfloat16"
  attention: "sdpa"
  device: "cuda:0"

vision:
  min_pixels: 200704  # 256 * 28 * 28
  max_pixels: 802816  # 1024 * 28 * 28
  processor_use_fast: false

inference:
  conditions:
    - "multimodal_conflict"
    - "text_only_conflict"
    - "multimodal_clean"
  batch_size: 1
  tokenizer_padding_side: "left"
  do_sample: false
  max_new_tokens: 32
  prompt_version: "qwen-native-v1"

evaluation:
  local_protocol: "exp001-local-eval-v1"
  deterministic_metrics:
    - "normalized_exact_match"
    - "token_f1"
    - "rouge_l_f1"
    - "reference_contained"
    - "explicit_target_rejection"
  paired_test: "exact_mcnemar"
  semantic_accuracy_requires_manual_review: true
  llm_judge_is_not_a_sole_metric: true

outputs:
  predictions: "outputs/predictions/exp001"
  metrics: "outputs/metrics/exp001"
  logs: "outputs/logs/exp001"
