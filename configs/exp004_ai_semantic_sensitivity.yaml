experiment:
  id: "EXP-004-S1"
  name: "AI-adjudicated semantic utility sensitivity"
  seed: 20260725

input:
  utility_records: >-
    outputs/metrics/exp003/qwen2_5_vl_3b_intervention_utility.jsonl
  action_review: "annotations/exp003_action_semantic_review_43.csv"
  expected_input_count: 43

adjudication:
  protocol: "exp003-paired-action-ai-prereview-v1"
  native_label_field: "ai_native_conflict_correct"
  intervention_label_field: "ai_intervention_conflict_correct"
  accepted_labels: ["yes", "no"]
  exclusion_rule: >-
    Exclude a pair before modeling when either conflict-action semantic
    correctness label is uncertain or blank.
  human_label_claim: false

feature_sets:
  contribution_only:
    - "conflict_identity_visual_delta"
  reliability_only:
    - "conflict_population_std_visual_delta"
    - "conflict_worst_drop_from_identity"
  contribution_plus_reliability:
    - "conflict_identity_visual_delta"
    - "conflict_population_std_visual_delta"
    - "conflict_worst_drop_from_identity"

validation:
  protocol: "repeated-nested-stratified-cv-v1"
  outer_folds: 5
  repeats: 20
  inner_folds: 3
  logistic_c_grid: [0.01, 0.1, 1.0, 10.0, 100.0]
  bootstrap_resamples: 5000

go_no_go:
  primary_feature_set: "contribution_plus_reliability"
  comparator_feature_set: "contribution_only"
  minimum_mean_auroc_gain: 0.05
  minimum_mean_policy_gain_over_always_intervention: 0.0
  minimum_repeat_auroc_win_fraction: 0.60

